services:
  - type: web
    name: livequiz
    env: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: (npx prisma db push || true) && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false

